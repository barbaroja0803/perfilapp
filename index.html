
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junior Anchundia | Full-Cycle Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --dev-cyan: #0891b2;
            --ops-lime: #65a30d;
            --bg-deep: #f8fafc;
            --text-main: #0f172a;
        }
        html {
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Circuit Pattern Background */
        .circuit-bg {
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(15, 23, 42, 0.05) 1px, transparent 0);
            background-size: 32px 32px;
            z-index: -1;
        }

        /* IC Skill Module */
        .skill-ic {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .skill-ic:hover {
            border-color: var(--dev-cyan);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.1);
            transform: scale(1.02);
        }
        .ic-pin {
            position: absolute;
            width: 4px;
            height: 2px;
            background: #334155;
        }
        .skill-ic:hover .ic-pin { background: var(--dev-cyan); }
        
        /* Floating Code Animation */
        .code-float {
            position: absolute;
            font-family: 'JetBrains Mono';
            font-size: 10px;
            color: rgba(15, 23, 42, 0.03);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        .section-tag {
            background: linear-gradient(90deg, #f1f5f9, transparent);
            border-left: 2px solid var(--dev-cyan);
            padding: 0.5rem 1rem;
            font-family: 'JetBrains Mono';
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--dev-cyan); }

        /* 3D Word Cube Effect */
        .perspective-1000 {
            perspective: 1500px;
        }
        .cube-letter {
            display: inline-block;
            transform-origin: center center -50px;
            backface-visibility: hidden;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;
        }
        .cube-letter.animating {
            transform: rotateX(-180deg) rotateY(20deg) scale(0.8);
            opacity: 0;
            filter: blur(10px);
        }
        /* Section Reveal Effect */
        .snap-section {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            perspective: 1000px;
        }
        .reveal-content {
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .reveal-content.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Shimmer Effect */
        .text-shimmer {
            background: linear-gradient(
                90deg, 
                #64748b 0%, 
                #0f172a 50%, 
                #64748b 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }
    </style>
<script type="importmap">
{

}
</script>
</head>

    <div class="circuit-bg"></div>
    <div id="root"></div>

</body>
</html>
